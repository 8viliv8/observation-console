<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GRAINLAB Input Test</title><style>body{margin:0;background:#0b0b0c;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,sans-serif;padding:20px}.wrap{max-width:720px;margin:auto}.pick{position:relative;display:block;margin:14px 0}.pick span{display:block;background:#f3f3f3;color:#111;padding:14px;border-radius:12px;text-align:center;font-weight:700}.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;z-index:2}.box{border:1px solid #333;border-radius:12px;padding:12px;color:#bbb;margin-top:12px;white-space:pre-wrap}.ok{color:#bdf5c4}.err{color:#ffb6b6}img{display:block;width:100%;height:auto;margin-top:16px;border-radius:12px;background:#18181a}.small{font-size:12px;color:#999;line-height:1.5}</style></head><body><div class="wrap"><h1>GRAINLAB</h1><p>iPhone Photo Library Diagnostic</p><label class="pick"><span>写真ライブラリから選ぶ</span><input id="photo" type="file" accept="image/*"></label><label class="pick"><span style="background:#222;color:#fff;border:1px solid #444">カメラで撮る</span><input id="camera" type="file" accept="image/*" capture="environment"></label><div id="status" class="box">Safariで開き、上のボタンを直接タップしてください。</div><img id="preview" hidden><p class="small">このページは画像をサーバーへ送信しません。選択した画像はブラウザ内だけでプレビューします。</p></div><script>(function(){var p=document.getElementById("photo"),c=document.getElementById("camera"),s=document.getElementById("status"),im=document.getElementById("preview");function set(t,k){s.textContent=t;s.className="box "+(k||"")}function load(f,src){if(!f)return;set(src+" を受け取りました\nname: "+f.name+"\ntype: "+(f.type||"(empty)")+"\nsize: "+(f.size/1048576).toFixed(2)+" MB");var u=URL.createObjectURL(f),x=new Image();x.onload=function(){im.src=u;im.hidden=false;set(src+" 読み込み成功\n"+x.naturalWidth+" × "+x.naturalHeight+" px","ok")};x.onerror=function(){set(src+" は選択できましたが画像デコードに失敗しました。\ntype: "+(f.type||"(empty)"),"err");URL.revokeObjectURL(u)};x.src=u}p.addEventListener("change",function(e){load(e.target.files&&e.target.files[0],"写真ライブラリ");e.target.value=""});c.addEventListener("change",function(e){load(e.target.files&&e.target.files[0],"カメラ");e.target.value=""})})();</script></body></html>
