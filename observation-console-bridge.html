<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Observation Console v18 — PON/CUT Bridge</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#050607;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050607}
.bridge{position:fixed;z-index:99999;right:12px;top:max(12px,env(safe-area-inset-top));display:flex;gap:7px;align-items:center;padding:7px;background:rgba(10,12,14,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.16);border-radius:14px;color:#fff}
button{appearance:none;border:1px solid rgba(255,255,255,.2);background:#1c1f23;color:#fff;border-radius:999px;padding:9px 12px;font:600 11px -apple-system,BlinkMacSystemFont,sans-serif}
button.primary{background:#0a84ff;border-color:#0a84ff}
#status{font-size:10px;color:#b8bec7;max-width:180px}
</style>
</head>
<body>
<iframe id="obs" src="./"></iframe>
<div class="bridge">
  <button id="importBtn" class="primary">IMPORT PON/CUT</button>
  <button id="clearBtn">CLEAR</button>
  <span id="status">bridge loading…</span>
</div>
<script>
const frame=document.getElementById('obs'),statusEl=document.getElementById('status');

function openBridgeDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open('poncut-obs-bridge',1);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('transfers'))db.createObjectStore('transfers',{keyPath:'id'})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function getLatest(){const db=await openBridgeDB();const tx=db.transaction('transfers','readonly'),req=tx.objectStore('transfers').get('latest');const val=await new Promise((res,rej)=>{req.onsuccess=()=>res(req.result);req.onerror=()=>rej(req.error)});db.close();return val}

function injectBridge(){
  const d=frame.contentDocument;if(!d)return;
  const s=d.createElement('script');
  s.textContent=`
  (() => {
    if (window.__poncutBridgeInstalled) return;
    window.__poncutBridgeInstalled = true;
    const originalPlayGrain = playGrain;
    playGrain = function(tr,time){
      if (!tr.customBuffer) return originalPlayGrain(tr,time);
      const anySolo = tracks.some(t => t.solo);
      if (anySolo) { if (!tr.solo) return; } else { if (tr.muted) return; }
      const src = actx.createBufferSource();
      src.buffer = tr.customBuffer;
      src.connect(tr.gainNode);
      tr.panNode.pan.setValueAtTime(Math.random()*1.2-0.6,time);
      src.start(time);
    };
    window.__poncutImport = async function(payload){
      if (!actx) await initAudio();
      if (actx.state === 'suspended') await actx.resume();
      const list=(payload && payload.grains)||[];
      const n=Math.min(TRACK_COUNT,list.length);
      for(let i=0;i<n;i++){
        const g=list[i];
        const b=actx.createBuffer(g.numberOfChannels,g.length,g.sampleRate);
        for(let ch=0;ch<g.numberOfChannels;ch++){
          b.copyToChannel(new Float32Array(g.channels[ch]),ch);
        }
        tracks[i].customBuffer=b;
        tracks[i].customName=g.name;
      }
      for(let i=n;i<TRACK_COUNT;i++){tracks[i].customBuffer=null;tracks[i].customName=null}
      if (typeof buildTracksUI==='function') buildTracksUI();
      return n;
    };
    window.__poncutClear = function(){
      tracks.forEach(t=>{t.customBuffer=null;t.customName=null});
      if (typeof buildTracksUI==='function') buildTracksUI();
    };
  })();
  `;
  d.body.appendChild(s);
}

frame.addEventListener('load',async()=>{
  try{injectBridge();const p=await getLatest();statusEl.textContent=p?.grains?.length?('ready · '+p.grains.length+' grains'):'no transfer'}catch(e){console.error(e);statusEl.textContent='bridge error'}
});

document.getElementById('importBtn').onclick=async()=>{
  try{
    const p=await getLatest();if(!p?.grains?.length){statusEl.textContent='no grains';return}
    injectBridge();
    const n=await frame.contentWindow.__poncutImport(p);
    statusEl.textContent=p.takeName+' · '+n+' tracks loaded';
  }catch(e){console.error(e);statusEl.textContent='IMPORT ERROR'}
};
document.getElementById('clearBtn').onclick=()=>{
  try{frame.contentWindow.__poncutClear?.();statusEl.textContent='custom grains cleared'}catch(e){statusEl.textContent='CLEAR ERROR'}
};
</script>
</body>
</html>
